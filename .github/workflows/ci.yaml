name: AsmaCare CI

on:
  push:
    branches:
      - main

jobs:
  backend:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven
          cache-dependency-path: backend/pom.xml

      - name: Build backend
        working-directory: backend
        run: mvn -B package

      - name: Build backend Docker image
        run: docker build -t asmacare-backend:${{github.sha}} ./backend    
    
  frontend:
    runs-on: ubuntu-latest

    steps:
     - name: Checkout code
       uses: actions/checkout@v4

     - name: Set up Node.js
       uses: actions/setup-node@v4
       with:
         node-version: '20'
         cache: npm
         cache-dependency-path: frontend/package-lock.json

     - name: Install dependencies
       working-directory: frontend
       run: npm ci 

     - name: Build frontend
       working-directory: frontend
       run: npm run build     
     
     - name: Build frontend Docker image
       run: docker build -t asmacare-frontend:${{ github.sha }} ./frontend    
