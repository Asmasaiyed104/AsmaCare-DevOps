apiVersion: v1
kind: Secret
metadata:
  name: asmacare-secret
type: Opaque
stringData:
  DB_USERNAME: {{ .Values.database.username | quote }}
  DB_PASSWORD: {{ .Values.database.password | quote }}
  {{- if .Values.mysql.enabled }}
  MYSQL_ROOT_PASSWORD: {{ .Values.mysql.auth.rootPassword | quote }}
  {{- end }}
