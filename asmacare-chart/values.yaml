backend:
  replicaCount: 1
  image:
    repository: ghcr.io/asmasaiyed104/asmacare-backend
    tag: latest
    pullPolicy: IfNotPresent
  service:
    port: 8080
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi

frontend:
  replicaCount: 1
  image:
    repository: ghcr.io/asmasaiyed104/asmacare-frontend
    tag: latest
    pullPolicy: IfNotPresent
  service:
    port: 80

mysql:
  enabled: true
  image:
    repository: mysql
    tag: "8.4"
  database: asmacare
  storage:
    size: 1Gi
  auth:
    username: asmacare
    password: CHANGE_ME
    rootPassword: CHANGE_ME    

ingress:
  enabled: true
  className: nginx

autoscaling:
  enabled: true
  minReplicas: 1
  maxReplicas: 5
  targetCPUUtilizationPercentage: 50

database:
  host: mysql
  port: 3306
  name: asmacare
  username: asmacare
  password: CHANGE_ME  
