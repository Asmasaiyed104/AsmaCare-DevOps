spring.application.name=asmacare-api
server.port=8080
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/asmacare}
spring.datasource.username=${DB_USERNAME:asmacare}
spring.datasource.password=${DB_PASSWORD:asmacare_dev}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.probes.enabled=true
