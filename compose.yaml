services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: asmacare
      MYSQL_USER: asmacare
      MYSQL_PASSWORD: asmacare_dev
      MYSQL_ROOT_PASSWORD: root_dev
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-proot_dev"]
      interval: 5s
      timeout: 5s
      retries: 20
  backend:
    build: ./backend
    environment:
      DB_URL: jdbc:mysql://mysql:3306/asmacare?createDatabaseIfNotExist=true&allowPublicKeyRetrieval=true&useSSL=false
      DB_USERNAME: asmacare
      DB_PASSWORD: asmacare_dev
    ports: ["8080:8080"]
    depends_on:
      mysql:
        condition: service_healthy
  frontend:
    build: ./frontend
    ports: ["5173:80"]
    depends_on: [backend]
volumes:
  mysql_data:
