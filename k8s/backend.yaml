apiVersion: v1
kind: Service
metadata:
  name: backend
  namespace: asmacare
spec:
  selector:
    app: backend
  ports:
    - port: 8080
      targetPort: 8080

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: asmacare
spec:
  replicas: 1
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
    spec:
      containers:
        - name: backend
          image: asmacare-backend:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
         
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 5

          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8080
            initialDelaySeconds: 20
            periodSeconds: 10

          resources:
              requests:
                cpu: "100m"
                memory: "128Mi"
              limits:
                cpu: "500m"
                memory: "512Mi"    

          env:
            - name: DB_URL
              value: "jdbc:mysql://mysql:3306/asmacare?createDatabaseIfNotExist=true&allowPublicKeyRetrieval=true&useSSL=false"

            - name: DB_USERNAME
              valueFrom:
                secretKeyRef:
                  name: asmacare-secret
                  key: DB_USERNAME

            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: asmacare-secret
                  key: DB_PASSWORD
